name: Aegis PR guard
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  guard:
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" --jq '.[].filename' > changed-paths.txt
          test -s changed-paths.txt
          {
            echo 'paths<<EOF'
            cat changed-paths.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: ./
        with:
          changed-paths: ${{ steps.changed.outputs.paths }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aegis-selection-manifest
          path: .aegis/manifests/*.json
          if-no-files-found: ignore
          retention-days: 90
  fork-guard:
    if: ${{ github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./
        with:
          changed-paths: '*'
