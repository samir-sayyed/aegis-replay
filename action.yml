name: Aegis Replay Guard
description: Run deterministic approved Aegis regression guards for a pull request.
inputs:
  changed-paths:
    description: Newline-delimited changed repository paths.
    required: true
  changed-symbols:
    description: Optional newline-delimited changed symbol identities.
    required: false
    default: ''
outputs:
  result:
    description: "Stable guard result: pass, recurrence, invalid, or indeterminate."
    value: ${{ steps.guard.outputs.result }}
  manifest:
    description: Sanitized selection manifest path when configuration exists.
    value: ${{ steps.guard.outputs.manifest }}
runs:
  using: composite
  steps:
    - shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - id: guard
      shell: bash
      env:
        CHANGED_PATHS: ${{ inputs.changed-paths }}
        CHANGED_SYMBOLS: ${{ inputs.changed-symbols }}
      run: |
        set -euo pipefail
        args=()
        symbol_args=()
        while IFS= read -r path; do
          [ -z "$path" ] || args+=(--changed "$path")
        done <<< "$CHANGED_PATHS"
        while IFS= read -r symbol; do
          [ -z "$symbol" ] || symbol_args+=(--symbol "$symbol")
        done <<< "$CHANGED_SYMBOLS"
        test "${#args[@]}" -gt 0
        if [ -f aegis.yaml ]; then
          aegis select --manifest "${args[@]}" "${symbol_args[@]}" >/dev/null
          manifest="$(find .aegis/manifests -maxdepth 1 -name '*.json' -print -quit)"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
        fi
        set +e
        output="$(aegis guard "${args[@]}" "${symbol_args[@]}")"
        status=$?
        set -e
        printf '%s\n' "$output"
        case "$output" in
          *"Aegis guard: pass") result=pass ;;
          *"Aegis guard: recurrence") result=recurrence ;;
          *"Aegis guard: invalid") result=invalid ;;
          *) result=indeterminate ;;
        esac
        echo "result=$result" >> "$GITHUB_OUTPUT"
        test "$status" -eq 0 && test "$result" = pass
